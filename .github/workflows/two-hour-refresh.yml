name: Commodity Signal Desk — two-hour refresh

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commodity-signal-desk-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check scheduler secret is configured
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Create the repository Actions secret CRON_SECRET with the same value as the Vercel production CRON_SECRET."
            exit 1
          fi

      - name: Refresh commodity analysis and send email digest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 \
            --connect-timeout 15 --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://trade-analyst-stella-store.vercel.app/api/run?digest=1"
