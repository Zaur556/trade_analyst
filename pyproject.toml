[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commodity-signal-desk"
version = "1.1.0"
description = "Buy/sell decision support for Brent, WTI, gold, silver and natural gas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "Commodity Signal Desk" }]
keywords = ["commodities", "trading", "brent", "wti", "gold", "silver", "natural-gas"]

[project.scripts]
commodity-agent = "commodity_agent.cli:main"

[tool.setuptools.packages.find]
include = ["commodity_agent*"]

[tool.vercel]
entrypoint = "api.run:handler"
